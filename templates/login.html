<!DOCTYPE html>
<html>
<head>
    <title>Police Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-dark text-white">
<div class="container mt-5" style="max-width: 400px;">
    <h3 class="text-center mt-5">पोलीस अधिकारी लॉगिन</h3>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-danger">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST" class="card p-4 text-dark shadow mt-3">
        <div class="mb-3">
            <label>Police ID:</label>
            <input type="text" name="police_id" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Password:</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">लॉगिन</button>
    </form>
    <p class="text-center mt-3 text-muted">डिफॉल्ट ID: POLICE101 | Pass: admin</p>
    <div class="text-center mt-3">
        <a href="/" class="text-white text-decoration-none">← होम पेजवर जा</a>
    </div>
</div>
</body>
</html>
