<!DOCTYPE html>
<html>
<head>
    <title>तक्रार नोंदवा</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <h2>चुकीच्या दंडाविरुद्ध तक्रार करा</h2>
    <form action="/complaint" method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm mt-3">
        <div class="mb-3"><label>पूर्ण नाव:</label><input type="text" name="name" class="form-control" required></div>
        <div class="mb-3"><label>मोबाईल नंबर:</label><input type="text" name="phone" class="form-control" required></div>
        <div class="mb-3"><label>गाडीचा नंबर:</label><input type="text" name="vehicle_no" class="form-control" required></div>
        <div class="mb-3"><label>पावती/Challan नंबर:</label><input type="text" name="challan_no" class="form-control" required></div>
        <div class="mb-3"><label>तक्रारीचे कारण:</label><textarea name="reason" class="form-control" required></textarea></div>
        <div class="mb-3"><label>पुरावा अपलोड करा (फोटो/पावती):</label><input type="file" name="evidence" class="form-control"></div>
        <button type="submit" class="btn btn-danger w-100">तक्रार सबमिट करा</button>
    </form>
    <div class="text-center mt-3">
        <a href="/" class="text-decoration-none">← होम पेजवर जा</a>
    </div>
</div>
</body>
</html>
